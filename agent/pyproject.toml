[project]
name = "locai-agent"
version = "1.0.0"
description = "WhatsApp property automation agent — LangGraph + FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langchain>=0.3.20,<0.4",
    "langchain-openai>=0.3.8,<0.4",
    "langchain-anthropic>=0.3.10,<0.4",
    "langgraph>=0.2.80,<0.3",
    "langsmith>=0.2.10",
    "httpx>=0.28.0",
    "structlog>=25.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
