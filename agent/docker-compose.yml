# ============================================================
# Locai Agent — Production Stack
# alugazapbrain.tensorroot.com (sem porta exposta ao host — só via tunnel)
#
# Dev local:  docker compose up  (acesso em localhost:8080)
# Produção:   docker compose --profile tunnel up -d
#
# Todas as configurações em .env.production (incluindo TUNNEL_TOKEN)
# ============================================================

services:

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: locai-agent:latest
    container_name: locai-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    networks:
      - agent-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Cloudflare Tunnel → alugazapbrain.tensorroot.com → agent:8080
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-agent
    restart: unless-stopped
    command: tunnel --no-autoupdate run --protocol http2
    env_file:
      - .env.production
    networks:
      - agent-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  agent-net:
    driver: bridge
